# Deploy frontend to Vercel PROD.
#
# This intentionally deploys from GitHub Actions with the configured Vercel token
# instead of relying on Vercel's GitHub integration. On Vercel Hobby, production
# deployments can fail when the commit author is not the Vercel project owner.
name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy-prod:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_ENV: prod
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || vars.NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Strip Git metadata for Vercel Hobby deploys
        run: rm -rf .git

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Resolve production auth URL
        run: |
          node <<'NODE'
          const fs = require("fs");
          const envPath = ".vercel/.env.production.local";
          const fallbackUrl = "https://bloomhub-fe-dev.vercel.app";

          const readPulledValue = () => {
            if (!fs.existsSync(envPath)) return "";
            const line = fs
              .readFileSync(envPath, "utf8")
              .split(/\r?\n/)
              .find((entry) => entry.startsWith("NEXTAUTH_URL="));
            if (!line) return "";
            const raw = line.slice("NEXTAUTH_URL=".length).trim();
            return raw.replace(/^['"]|['"]$/g, "");
          };

          const resolved = process.env.NEXTAUTH_URL || readPulledValue() || fallbackUrl;
          new URL(resolved);

          fs.appendFileSync(process.env.GITHUB_ENV, `NEXTAUTH_URL=${resolved}\n`);

          if (fs.existsSync(envPath)) {
            const current = fs.readFileSync(envPath, "utf8");
            const next = current.match(/^NEXTAUTH_URL=/m)
              ? current.replace(/^NEXTAUTH_URL=.*$/m, `NEXTAUTH_URL="${resolved}"`)
              : `${current.replace(/\s*$/, "\n")}NEXTAUTH_URL="${resolved}"\n`;
            fs.writeFileSync(envPath, next);
          }
          NODE

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
