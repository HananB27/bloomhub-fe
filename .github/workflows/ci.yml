# CI: lint, format check, and tests on every push/PR
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline
        timeout-minutes: 8

      - name: Lint
        run: npm run lint -- src --max-warnings=25
        timeout-minutes: 4

      - name: Format check
        run: npm run format:check 2>&1 | head -50
        timeout-minutes: 2

      - name: Test
        run: npm run test -- --run --reporter=verbose 2>&1 | tail -200
        timeout-minutes: 8
