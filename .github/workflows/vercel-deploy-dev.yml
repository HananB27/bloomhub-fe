name: Vercel override commit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HANAN_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "Hanan Bajramovic"
          git config user.email "hananbajramovic075@gmail.com"

      - name: Commit
        run: |
          git commit --allow-empty -m "chore: override commit"

      - name: Push Changes
        run: |
          git push origin HEAD:main
